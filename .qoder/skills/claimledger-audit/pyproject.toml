[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimledger"
version = "0.5.1"
description = "Local evidence audit and delivery workflow for AI-generated reports"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-docx>=1.2.0,<2",
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.24.3,<2",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
local-ai = [
  "openvino>=2026.0,<2027",
  "openvino-genai>=2026.0,<2027",
  "paddleocr>=3.2",
  "paddlepaddle>=3.2,<4",
  "huggingface-hub>=0.27,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
claimledger = "claimledger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/claimledger/assets" = ["assets/models.yaml", "assets/claimledger-icon-1024.png"]
"share/claimledger/assets/rules" = ["assets/rules/*.yaml"]
"share/claimledger/assets/profiles" = ["assets/profiles/*.yaml"]
"share/claimledger/assets/ui" = ["assets/ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
